# MySQL for development. Extended by the project's docker/compose.yml when selected; the project
# adds a data volume on /var/lib/mysql when it wants persistence. The image creates the root
# account from MYSQL_ROOT_PASSWORD, so the application connects as root. The service name is the
# host (MYSQL_HOST=mysql). The public port binds to the host's loopback only. The healthcheck
# goes over TCP (-h 127.0.0.1; for the MySQL client "localhost" means the socket): the image's
# first-run initialization runs a temporary socket-only server that would answer a socket check.
services:
  mysql:
    image: mysql:${MYSQL_VERSION:?set MYSQL_VERSION in docker/.env}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in docker/.env}
    ports:
      - "127.0.0.1:${MYSQL_PUBLIC_PORT:?set MYSQL_PUBLIC_PORT in docker/.env}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
