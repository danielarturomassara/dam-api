# PostgreSQL for development. Extended by the project's docker/compose.yml when selected; the
# project adds a data volume on /var/lib/postgresql/data when it wants persistence. The service
# name is the host the application reaches it at (POSTGRESQL_HOST=postgresql). The public port
# binds to the host's loopback only. The healthcheck goes over TCP (-h localhost): the image's
# first-run initialization runs a temporary socket-only server that would answer a socket check.
services:
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:?set POSTGRESQL_VERSION in docker/.env}
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:?set POSTGRESQL_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:?set POSTGRESQL_DATABASE in docker/.env}
    ports:
      - "127.0.0.1:${POSTGRESQL_PUBLIC_PORT:?set POSTGRESQL_PUBLIC_PORT in docker/.env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
