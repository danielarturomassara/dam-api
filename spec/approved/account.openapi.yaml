openapi: 3.1.0
info:
  title: Account module
  version: "1.0"
  description: Machine-readable form of spec/approved/account.spec.md §3.3, §3.6–§3.8 and §3.10–§3.12. The prose tables and this document say the same thing; when they disagree, the prose wins. The endpoint contract suites pin each implemented response row against the running stack.
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register an account with one identity provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: The account was created, or the primary contact already belongs to an account and the provider creates its identity unverified (password, phone) — the duplicate is silenced.
        "400":
          description: The body is malformed or fails a rule in §4.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                missingProvider:
                  value: "provider is required"
                unknownProvider:
                  value: "Unknown provider: carrier-pigeon"
                missingField:
                  value: "password is required for password provider"
                mistypedField:
                  value: "phone must be a string for phone provider"
                malformedJson:
                  value: "Malformed JSON body"
        "409":
          description: The primary contact already belongs to an account and the provider creates its identity already verified (oauth).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                email:
                  value: "Conflict: email."
                phone:
                  value: "Conflict: phone."
        "429":
          $ref: "#/components/responses/Throttled"
        "501":
          description: The functionality is not implemented.
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/verify:
    post:
      operationId: verifyIdentity
      summary: Verify an identity that is verified through a link, without logging in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "204":
          description: The identity was verified. No token is issued.
        "400":
          description: The verification is not proven (one message for every cause), the body is malformed, fails a rule in §4.17, or names a provider that has no verification step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                notProven:
                  value: "Invalid or expired verification"
                missingField:
                  value: "hash is required for password provider"
                mistypedField:
                  value: "email must be a string for password provider"
                providerWithoutVerification:
                  value: "phone provider has no verification step"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/login:
    post:
      operationId: login
      summary: Prove the credential of one identity provider and receive an access token and a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The credential is proven and the identity may log in. The first code a phone identity proves also verifies it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginTokens"
        "400":
          description: The body is malformed or fails a rule in §4.8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                missingProvider:
                  value: "provider is required"
                unknownProvider:
                  value: "Unknown provider: carrier-pigeon"
                missingField:
                  value: "password is required for password provider"
                mistypedField:
                  value: "code must be a string for phone provider"
                malformedJson:
                  value: "Malformed JSON body"
        "401":
          description: The credential is not proven. One message for every cause.
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BearerChallenge"
          content:
            application/json:
              schema:
                type: string
                const: "Unauthorized. Reason: Invalid credentials."
        "403":
          description: The credential is proven and the account or the identity may not log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginNotAllowed"
        "429":
          $ref: "#/components/responses/Throttled"
        "501":
          description: The provider's flow is not implemented.
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/login/code:
    post:
      operationId: requestLoginCode
      summary: Send a one-time login code to the owner of an identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeRequest"
      responses:
        "202":
          description: A code was sent, or the request was silenced — the phone belongs to no account, the account has no phone identity, the account or the identity is disabled, or a code was requested less than the resend interval ago. An unverified phone identity is sent a code.
        "400":
          description: The body is malformed, fails a rule in §4.8, or names a provider that sends no codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                missingField:
                  value: "phone is required for phone provider"
                providerWithoutCodes:
                  value: "password provider does not send login codes"
        "429":
          $ref: "#/components/responses/Throttled"
        "501":
          description: Code delivery is not implemented.
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/token/refresh:
    post:
      operationId: refreshAccessToken
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: The refresh token is valid, is not revoked, and its identity may log in. No new refresh token is issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenOnly"
        "400":
          description: The body is malformed, or refreshToken is missing or not a string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                missingToken:
                  value: "refreshToken is required"
                mistypedToken:
                  value: "refreshToken must be a string"
        "401":
          description: The refresh token is not valid, is revoked, or its account or identity no longer exists. One message for every cause.
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BearerChallenge"
          content:
            application/json:
              schema:
                type: string
                const: "Unauthorized. Reason: Invalid refresh token."
        "403":
          description: The refresh token is valid and the account or the identity may not log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginNotAllowed"
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/logout:
    post:
      operationId: logout
      summary: End one login by revoking its access token and its refresh token
      security:
        - bearerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The access token of the header and the refresh token of the body are revoked. Logging out twice answers the same.
        "400":
          description: The body is malformed, or refreshToken is missing or not a string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reason"
              examples:
                missingToken:
                  value: "refreshToken is required"
                mistypedToken:
                  value: "refreshToken must be a string"
        "401":
          description: The request carries no bearer token, the access token is not valid or is revoked, or the refresh token is not valid or is not a token of the authenticated account. Nothing is revoked.
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BearerChallenge"
          content:
            application/json:
              schema:
                type: string
                enum:
                  - "Unauthorized. Reason: Missing access token."
                  - "Unauthorized. Reason: Invalid access token."
                  - "Unauthorized. Reason: Invalid refresh token."
        "500":
          $ref: "#/components/responses/UnknownError"
  /auth/logout/all:
    post:
      operationId: logoutEverywhere
      summary: End every login of the account by revoking every token issued to it so far
      security:
        - bearerAccessToken: []
      responses:
        "204":
          description: Every token issued to the account up to this request is revoked, the access token of the header included. A token issued afterwards is not.
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "500":
          $ref: "#/components/responses/UnknownError"
components:
  securitySchemes:
    bearerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token of POST /auth/login or POST /auth/token/refresh, in the Authorization header. It authenticates until it expires or is revoked.
  headers:
    BearerChallenge:
      description: The challenge every 401 answer carries (core.spec.md §4.5).
      schema:
        type: string
        const: Bearer
    NoStore:
      description: Token answers are never stored by caches.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole seconds until the throttle window ends, at least 1.
      schema:
        type: integer
        minimum: 1
  responses:
    NotAuthenticated:
      description: The request carries no bearer token, or its access token is not valid or is revoked (§4.18).
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
      content:
        application/json:
          schema:
            type: string
            enum:
              - "Unauthorized. Reason: Missing access token."
              - "Unauthorized. Reason: Invalid access token."
    Throttled:
      description: The client address exceeded the throttle (§4.7).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            type: string
            const: "Too many requests."
    UnknownError:
      description: Anything the module did not anticipate.
      content:
        application/json:
          schema:
            type: string
            const: "Unknown error"
  schemas:
    Reason:
      type: string
      description: The reason, serialized as a JSON string.
    RegisterRequest:
      description: Unknown fields at any depth are ignored. Field names inside providerData are the provider's own and are not translated.
      oneOf:
        - $ref: "#/components/schemas/PasswordRegistration"
        - $ref: "#/components/schemas/PhoneRegistration"
        - $ref: "#/components/schemas/AppleRegistration"
        - $ref: "#/components/schemas/GoogleRegistration"
        - $ref: "#/components/schemas/MetaRegistration"
      discriminator:
        propertyName: provider
        mapping:
          password: "#/components/schemas/PasswordRegistration"
          phone: "#/components/schemas/PhoneRegistration"
          apple: "#/components/schemas/AppleRegistration"
          google: "#/components/schemas/GoogleRegistration"
          meta: "#/components/schemas/MetaRegistration"
    PasswordRegistration:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: password
        providerData:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
              description: Lower-cased before validation and storage.
            password:
              type: string
              minLength: 8
              description: At most 72 bytes; must satisfy the configured composition rules (§3.4).
    PhoneRegistration:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: phone
        providerData:
          type: object
          required: [phone]
          properties:
            phone:
              type: string
              description: International form; normalized to E.164 only when it carries a + or 00 prefix.
    AppleRegistration:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: apple
        providerData:
          type: object
          description: Sign in with Apple authorization response, verbatim.
          required: [code, id_token, state]
          properties:
            code: {type: string}
            id_token: {type: string}
            state: {type: string}
            user:
              type: object
              required: [email, name]
              properties:
                email: {type: string, format: email}
                name:
                  type: object
                  required: [firstName, lastName]
                  properties:
                    firstName: {type: string}
                    lastName: {type: string}
    GoogleRegistration:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: google
        providerData:
          type: object
          description: Google OAuth token response, verbatim.
          required: [access_token, expires_in, id_token, scope, token_type]
          properties:
            access_token: {type: string}
            expires_in: {type: number}
            id_token: {type: string}
            refresh_token: {type: string}
            scope: {type: string}
            token_type: {type: string}
    MetaRegistration:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: meta
        providerData:
          type: object
          description: Facebook SDK login response, verbatim.
          required: [authResponse, status]
          properties:
            authResponse:
              type: object
              required: [accessToken, expiresIn, userID]
              properties:
                accessToken: {type: string}
                expiresIn:
                  oneOf:
                    - {type: number}
                    - {type: string}
                userID: {type: string}
            status: {type: string}
    VerifyRequest:
      description: Only the password provider has a verification step. Unknown fields at any depth are ignored.
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: password
        providerData:
          type: object
          required: [email, hash]
          properties:
            email:
              type: string
              format: email
              description: The account's primary email. Lower-cased before validation.
            hash:
              type: string
              description: The token of the verification link. It verifies once, within 24 hours of the registration.
    LoginNotAllowed:
      type: string
      enum:
        - "Login not allowed. Reason: account disabled."
        - "Login not allowed. Reason: identity disabled."
        - "Login not allowed. Reason: identity not verified."
    LoginTokens:
      type: object
      required: [accessToken, expiresIn, refreshExpiresIn, refreshToken, tokenType]
      properties:
        accessToken:
          type: string
          description: JSON Web Token signed with HS256; claims in §3.9.
        expiresIn:
          type: integer
          description: Lifetime of the access token in seconds.
        refreshExpiresIn:
          type: integer
          description: Lifetime of the refresh token in seconds.
        refreshToken:
          type: string
          description: JSON Web Token signed with HS256; claims in §3.9.
        tokenType:
          const: Bearer
    AccessTokenOnly:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: JSON Web Token signed with HS256; claims in §3.9.
        expiresIn:
          type: integer
          description: Lifetime of the access token in seconds.
        tokenType:
          const: Bearer
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      description: Unknown fields are ignored.
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token of the login being ended. It must be a token of the account the access token authenticates.
    LoginRequest:
      description: Unknown fields at any depth are ignored. The oauth shapes are the registration shapes, verbatim.
      oneOf:
        - $ref: "#/components/schemas/PasswordLogin"
        - $ref: "#/components/schemas/PhoneLogin"
        - $ref: "#/components/schemas/AppleRegistration"
        - $ref: "#/components/schemas/GoogleRegistration"
        - $ref: "#/components/schemas/MetaRegistration"
      discriminator:
        propertyName: provider
        mapping:
          password: "#/components/schemas/PasswordLogin"
          phone: "#/components/schemas/PhoneLogin"
          apple: "#/components/schemas/AppleRegistration"
          google: "#/components/schemas/GoogleRegistration"
          meta: "#/components/schemas/MetaRegistration"
    PasswordLogin:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: password
        providerData:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
              description: The account's primary email. Lower-cased before validation.
            password:
              type: string
              description: No length or composition rule applies at login; a password longer than 72 bytes is never proven.
    PhoneLogin:
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: phone
        providerData:
          type: object
          required: [phone, code]
          properties:
            phone:
              type: string
              description: The account's primary phone in international form; normalized to E.164 only when it carries a + or 00 prefix.
            code:
              type: string
              pattern: "^[0-9]+$"
              description: The one-time code obtained through POST /auth/login/code.
    LoginCodeRequest:
      description: Only the phone provider sends login codes.
      type: object
      required: [provider, providerData]
      properties:
        provider:
          const: phone
        providerData:
          type: object
          required: [phone]
          properties:
            phone:
              type: string
              description: The account's primary phone in international form; normalized to E.164 only when it carries a + or 00 prefix.
